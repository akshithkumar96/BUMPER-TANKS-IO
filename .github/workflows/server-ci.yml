name: Server CI

on:
  push:
    paths:
      - 'Server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'Server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build BumperTanks.Server.csproj --configuration Release
      - name: Start service and verify health and rewards
        run: |
          set -euo pipefail
          export Storage__ProfilePath="$RUNNER_TEMP/bumper-profiles.json"
          export Storage__IdentityPath="$RUNNER_TEMP/bumper-identities.json"
          export Storage__TelemetryPath="$RUNNER_TEMP/bumper-telemetry.json"
          export ASPNETCORE_ENVIRONMENT=Production
          export Rewards__RequireMatchAttestation=true
          export Rewards__MatchAttestationSecret=ci-only-match-attestation-secret-32-bytes-minimum
          dotnet run --no-build --configuration Release --urls http://127.0.0.1:5188 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          healthy=false
          for i in {1..10}; do if curl --fail --silent http://127.0.0.1:5188/health; then healthy=true; break; fi; sleep 1; done
          test "$healthy" = true
          python3 realtime_smoke.py http://127.0.0.1:5188
          identity=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5188/v1/identity/anonymous)
          player_id=$(echo "$identity" | jq -r '.playerId')
          player_token=$(echo "$identity" | jq -r '.accessToken')
          auth_header="Authorization: Bearer $player_token"
          poor_identity=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5188/v1/identity/anonymous)
          poor_player_id=$(echo "$poor_identity" | jq -r '.playerId')
          poor_player_token=$(echo "$poor_identity" | jq -r '.accessToken')
          poor_auth_header="Authorization: Bearer $poor_player_token"
          match_id=fedcba9876543210fedcba9876543210
          invalid_player_body='{"playerId":"not-a-player-id"}'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/rewards/daily -H 'Content-Type: application/json' -d "$invalid_player_body")
          test "$status" = "401"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/rewards/daily -H 'Content-Type: application/json' -H "$auth_header" -d "$invalid_player_body")
          test "$status" = "403"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5188/v1/profiles/not-a-player-id)
          test "$status" = "401"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -H "$auth_header" http://127.0.0.1:5188/v1/profiles/not-a-player-id)
          test "$status" = "403"
          daily_body=$(jq -n --arg player "$player_id" '{playerId:$player}')
          daily=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5188/v1/rewards/daily -H 'Content-Type: application/json' -H "$auth_header" -d "$daily_body")
          echo "$daily" | jq -e '.award == 25 or .award == 50 or .award == 75 or .award == 100'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/rewards/daily -H 'Content-Type: application/json' -H "$auth_header" -d "$daily_body")
          test "$status" = "409"
          match_body=$(jq -n --arg player "$player_id" --arg match "$match_id" '{playerId:$player,matchId:$match,gems:7,eliminations:2}')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/matches/complete -H 'Content-Type: application/json' -H "$auth_header" -d "$match_body")
          test "$status" = "401"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/matches/complete -H 'Content-Type: application/json' -H "$auth_header" -H 'X-Match-Attestation: invalid' -d "$match_body")
          test "$status" = "403"
          attestation_payload=$(printf '%s\n%s\n%d\n%d' "$player_id" "$match_id" 7 2)
          attestation=$(printf '%s' "$attestation_payload" | openssl dgst -sha256 -hmac "$Rewards__MatchAttestationSecret" -binary | xxd -p -c 256)
          match=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5188/v1/matches/complete -H 'Content-Type: application/json' -H "$auth_header" -H "X-Match-Attestation: $attestation" -d "$match_body")
          echo "$match" | jq -e '.award == 27 and .profile.matchesPlayed == 1'
          catalog=$(curl --fail --silent --show-error http://127.0.0.1:5188/v1/cosmetics)
          echo "$catalog" | jq -e 'any(.items[]; .id == "flag_checkered" and .category == "flag" and .price == 20)'
          purchase_body=$(jq -n --arg player "$player_id" '{playerId:$player,cosmeticId:"flag_checkered"}')
          purchase=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5188/v1/cosmetics/purchase -H 'Content-Type: application/json' -H "$auth_header" -d "$purchase_body")
          echo "$purchase" | jq -e '.cosmeticId == "flag_checkered" and .profile.ownedCosmetics == ["flag_checkered"]'
          echo "$purchase" | jq --argjson daily_award "$(echo "$daily" | jq -r '.award')" -e '.profile.battleCoins == $daily_award + 7'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/cosmetics/purchase -H 'Content-Type: application/json' -H "$auth_header" -d "$purchase_body")
          test "$status" = "409"
          insufficient_purchase=$(jq -n --arg player "$poor_player_id" '{playerId:$player,cosmeticId:"flag_comet"}')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/cosmetics/purchase -H 'Content-Type: application/json' -H "$poor_auth_header" -d "$insufficient_purchase")
          test "$status" = "409"
          tampered_match_body=$(jq -n --arg player "$player_id" --arg match "$match_id" '{playerId:$player,matchId:$match,gems:8,eliminations:2}')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/matches/complete -H 'Content-Type: application/json' -H "$auth_header" -H "X-Match-Attestation: $attestation" -d "$tampered_match_body")
          test "$status" = "403"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/matches/complete -H 'Content-Type: application/json' -H "$auth_header" -H "X-Match-Attestation: $attestation" -d "$match_body")
          test "$status" = "409"
          invalid_match_body=$(jq -n --arg player "$player_id" --arg match "$match_id" '{playerId:$player,matchId:$match,gems:1001,eliminations:0}')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/matches/complete -H 'Content-Type: application/json' -d "$invalid_match_body")
          test "$status" = "401"
          invalid_telemetry_body=$(jq -n --arg player "$player_id" '{playerId:$player,name:"unexpected_event"}')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/telemetry -H 'Content-Type: application/json' -d "$invalid_telemetry_body")
          test "$status" = "401"
          telemetry_body=$(jq -n --arg player "$player_id" '{playerId:$player,name:"match_started"}')
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/telemetry -H 'Content-Type: application/json' -H "$auth_header" -d "$telemetry_body")
          test "$status" = "202"
          kill "$service_pid"
          wait "$service_pid" || true
          dotnet run --no-build --configuration Release --urls http://127.0.0.1:5188 &
          service_pid=$!
          healthy=false
          for i in {1..10}; do if curl --fail --silent http://127.0.0.1:5188/health; then healthy=true; break; fi; sleep 1; done
          test "$healthy" = true
          profile=$(curl --fail --silent --show-error -H "$auth_header" "http://127.0.0.1:5188/v1/profiles/$player_id")
          echo "$profile" | jq -e '.matchesPlayed == 1 and .ownedCosmetics == ["flag_checkered"]'
          jq -e 'length == 1 and .[0].Name == "match_started"' "$Storage__TelemetryPath"
