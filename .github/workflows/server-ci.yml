name: Server CI

on:
  push:
    paths:
      - 'Server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'Server/**'
      - '.github/workflows/server-ci.yml'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build BumperTanks.Server.csproj --configuration Release
      - name: Start service and verify health and rewards
        run: |
          dotnet run --no-build --configuration Release --urls http://127.0.0.1:5188 &
          healthy=false
          for i in {1..10}; do if curl --fail --silent http://127.0.0.1:5188/health; then healthy=true; break; fi; sleep 1; done
          test "$healthy" = true
          player_id=0123456789abcdef0123456789abcdef
          match_id=fedcba9876543210fedcba9876543210
          daily_body=$(jq -n --arg player "$player_id" '{playerId:$player}')
          daily=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5188/v1/rewards/daily -H 'Content-Type: application/json' -d "$daily_body")
          echo "$daily" | jq -e '.award == 25 or .award == 50 or .award == 75 or .award == 100'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/rewards/daily -H 'Content-Type: application/json' -d "$daily_body")
          test "$status" = "409"
          match_body=$(jq -n --arg player "$player_id" --arg match "$match_id" '{playerId:$player,matchId:$match,gems:7,eliminations:2}')
          match=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5188/v1/matches/complete -H 'Content-Type: application/json' -d "$match_body")
          echo "$match" | jq -e '.award == 27 and .profile.matchesPlayed == 1'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:5188/v1/matches/complete -H 'Content-Type: application/json' -d "$match_body")
          test "$status" = "409"
