name: Unity CI

on:
  workflow_dispatch:
  push:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "Tests/**"
      - ".github/workflows/unity-ci.yml"
  pull_request:
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "Tests/**"
      - ".github/workflows/unity-ci.yml"

concurrency:
  group: unity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unity-ci-gate:
    name: Check Unity CI configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Check opt-in and Unity license
        id: gate
        shell: bash
        env:
          UNITY_CI_ENABLED: ${{ vars.UNITY_CI_ENABLED }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [[ "$UNITY_CI_ENABLED" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Unity tests and player builds skipped. Set repository variable UNITY_CI_ENABLED=true and add the UNITY_LICENSE Actions secret to enable them." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$UNITY_LICENSE" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Unity tests and player builds skipped. UNITY_CI_ENABLED is true, but the UNITY_LICENSE Actions secret is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Unity CI is enabled; Edit Mode and Play Mode tests and player builds will run." >> "$GITHUB_STEP_SUMMARY"

  unity-tests:
    name: Edit Mode and Play Mode tests
    needs: unity-ci-gate
    if: needs.unity-ci-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.3.8f1
          testMode: all
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  player-builds:
    name: Build ${{ matrix.name }}
    needs: [unity-ci-gate, unity-tests]
    if: needs.unity-ci-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebGL
            target: WebGL
            method: BumperTanks.Editor.BumperTanksBuildEntrypoint.BuildWebGlDevelopment
            artifactPath: Build/WebGLDevelopment/BumperTanksIO
          - name: Windows-x64
            target: StandaloneWindows64
            method: BumperTanks.Editor.BumperTanksBuildEntrypoint.BuildWindowsDevelopment
            artifactPath: Build/StandaloneWindows64Development
          - name: Android-Development
            target: Android
            method: BumperTanks.Editor.BumperTanksBuildEntrypoint.BuildAndroidDevelopment
            artifactPath: Build/AndroidDevelopment/BumperTanksIO.apk
          - name: Android-ARM64-Development
            target: Android
            method: BumperTanks.Editor.BumperTanksBuildEntrypoint.BuildAndroidArm64Development
            artifactPath: Build/AndroidArm64Development/BumperTanksIO.apk
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.3.8f1
          targetPlatform: ${{ matrix.target }}
          buildMethod: ${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        with:
          name: bumper-tanks-${{ matrix.name }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 14
